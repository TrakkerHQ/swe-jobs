name: Refresh listings

on:
  schedule:
    # 22:17 UTC = 18:17 ET (17:17 in winter). Never :00, which GitHub delays or drops under load.
    - cron: "17 22 * * *"
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  contents: write # the default token is read-only; without this the push fails

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and render
        env:
          TRAKKER_API_KEY: ${{ secrets.TRAKKER_API_KEY }}
        run: python scripts/update.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/jobs.json
          git diff --staged --quiet || git commit -m "Update listings"
          git push
